baseURL = 'https://coolsimsoftware.com'
languageCode = 'en-us'
title = 'CoolSim Next - Next-Generation Data Center Thermal Modeling'
theme = ''

[params]
  description = "Design, simulate, and optimize data center cooling — from browser or desktop. Powered by OpenFOAM."
  author = "Applied Math Modeling, Inc."
  github = "https://github.com/coolsimsoftware"
  linkedin = "https://linkedin.com/company/coolsimsoftware"
  twitter = "https://twitter.com/coolsim"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[build]
  writeStats = true

[services]
  [services.googleAnalytics]
    id = ""

[menu]
  [[menu.main]]
    name = "Features"
    url = "/#features"
    weight = 10
  [[menu.main]]
    name = "Pricing"
    url = "/pricing/"
    weight = 20
  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 30
  [[menu.main]]
    name = "Blog"
    url = "/blog/"
    weight = 40
  [[menu.main]]
    name = "Docs"
    url = "https://docs.coolsimsoftware.com"
    weight = 50
    external = true

# Enable PostCSS processing
[markup.asciidocExt]
  preserveTOC = false

[module]
  [module.hugoVersion]
    extended = true